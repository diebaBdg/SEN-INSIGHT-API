spring.application.name=sen-insight-backend

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.0ec90b57d6e95fcbda19832f.supabase.co:5432/postgres}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:SenInsightSecretKey2024VeryLongSecretKeyForJWTSigningSenInsight}
app.jwt.expiration=86400000

server.port=8080
server.servlet.context-path=/api

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

logging.level.com.seninsight=INFO
logging.level.org.hibernate.SQL=WARN
