# ========================================================
# APPLICATION
# ========================================================
spring.application.name=${APP_NAME:sen-insight-backend}

server.port=${SERVER_PORT:8080}
server.servlet.context-path=${SERVLET_CONTEXT_PATH:/api}

# ========================================================
# DATABASE - POSTGRESQL
# ========================================================
spring.datasource.url=jdbc:postgresql://${SERVER_DS_URL:localhost}:${SERVER_DS_PORT:5432}/${DB_NAME:sen_insight_db}
spring.datasource.username=${DB_USER_NAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================================================
# JPA / HIBERNATE
# ========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# HIKARI
# ========================================================
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:5}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${HIKARI_MAX_LIFETIME:600000}

# ========================================================
# JWT
# ========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================================
# SECURITY
# ========================================================
app.security.enabled=${APP_SECURITY_ENABLED:false}

# ========================================================
# CORS
# ========================================================
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# ========================================================
# FILE UPLOAD
# ========================================================
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:15MB}

# ========================================================
# SWAGGER / OPENAPI
# ========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ========================================================
# LOGGING
# ========================================================
logging.level.com.seninsight=INFO
logging.level.org.hibernate.SQL=WARN